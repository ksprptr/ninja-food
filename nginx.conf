# Serves the static export of the site, see Dockerfile
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Redirects keep the host and port the client used, not the container's
  absolute_redirect off;

  gzip on;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  # Clean URLs: /menu is served from menu.html, /kategorie/burgery from kategorie/burgery.html
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # Build assets have a content hash in their name, so they never change
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  error_page 404 /404.html;
}
